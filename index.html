<style>
:root{--bg:#f3f4f1;--panel:#fff;--ink:#15171a;--ink2:#55595f;--line:#dcded9;--accent:#1f5fbf;--on:#fff;--err:#9a3b2f}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);

form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}

label{font-size:.9rem;color:var(--ink2);display:flex;gap:8px;align-items:center}
button{font:inherit;padding:10px;border-radius:8px;border:0;background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;font-size:.88rem;color:var(--err);margin:0}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "hayami-key:" + P.salt;
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
// 復号できたら（＝鍵が正しければ）中身の文字列を返す。違えば例外
async function unlock(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
// 表示するとこのスクリプトは消えるので、保存などは必ずこの前に済ませる
function render(html){ document.open(); document.write(html); document.close(); }
async function tryStored(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(_){}
  if(!raw) return false;
  try{
    const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]);
    render(await unlock(key)); return true;
  }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} return false; }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), msg = document.getElementById("msg");
  go.disabled = true; msg.textContent = "確認中…";
  let html;
  try{
    const key = await derive(document.getElementById("pw").value);
    html = await unlock(key);
    if(document.getElementById("rem").checked){
      try{
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        localStorage.setItem(KEY, btoa(String.fromCharCode(...raw)));
      }catch(_){}   // 保存できない環境（プライベートブラウズ等）でも表示はする
    }
  }catch(err){ msg.textContent = "パスワードが違います。"; go.disabled = false; return; }
  render(html);
});
(async () => {
  if(!window.crypto || !crypto.subtle){ document.body.textContent = "このブラウザでは開けません（https で開いてください）。"; return; }
  if(!(await tryStored())) document.getElementById("f").hidden = false;
})();
